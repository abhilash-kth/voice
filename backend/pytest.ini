[pytest]
# pytest-asyncio: the whole suite shares ONE event loop because app/db.py binds
# the Prisma client to the running loop (see tests/conftest.py).
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:prisma.*
