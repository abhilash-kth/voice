name: voice

# Shared configuration between API and Worker
x-common: &common-config
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env
  volumes:
    - voice-data:/app/data
    - ./backend/google-key.json:/app/google-key.json:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  # -------------------------------------------------------------
  # API Service (HTTP Web Server)
  # -------------------------------------------------------------
  api:
    <<: *common-config
    # Using expose avoids host port collision in Coolify
    expose:
      - "${PORT:-8000}"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port ${PORT:-8000}
      --proxy-headers
      --forwarded-allow-ips='*'
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; p = os.getenv('PORT', '8000'); urllib.request.urlopen(f'http://localhost:{p}/api/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M

  # -------------------------------------------------------------
  # Worker Service (Outbound LiveKit / Voice Agent)
  # -------------------------------------------------------------
  worker:
    <<: *common-config
    command: python -m app.agents.worker
    # Worker waits until API healthcheck passes before starting
    depends_on:
      api:
        condition: service_healthy
    # Gives ongoing calls time to safely finish on redeployment
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  voice-data:
