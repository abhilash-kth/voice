name: voice

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - voice-data:/app/data
      - ./backend/google-key.json:/app/google-key.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/health'')"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.agents.worker
    # NO ports here — deliberately. The worker is outbound-only.
    env_file:
      - ./backend/.env
    volumes:
      - voice-data:/app/data
      - ./backend/google-key.json:/app/google-key.json:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  voice-data:
